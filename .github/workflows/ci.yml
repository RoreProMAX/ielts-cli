name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
        app: ['v1.0.0', 'v2.0.0', 'v3.3.0']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-test.txt
      - name: Unit and isolated terminal tests
        working-directory: apps/${{ matrix.app }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          IELTS_DISABLE_UPDATE_CHECK: '1'
        run: python -B -m unittest discover -q

  platform-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-windows.txt
      - name: Update engine and study-session transition tests
        working-directory: apps/v3.3.0
        env:
          IELTS_DISABLE_UPDATE_CHECK: '1'
        run: python -X utf8 -B -m unittest -q test_updater test_update_tui
      - name: Check dependencies and isolated profile startup
        run: |
          python -X utf8 -B launcher.py --doctor
          python -X utf8 -B - <<'PY'
          import json
          import subprocess
          import sys
          import tempfile
          for version in ('1', '2', '3'):
              with tempfile.TemporaryDirectory() as directory:
                  result = subprocess.run(
                      [sys.executable, '-X', 'utf8', '-B', 'launcher.py',
                       '--app-version', version, '--data-dir', directory, '--stats'],
                      capture_output=True, text=True, encoding='utf-8', check=True)
                  assert json.loads(result.stdout)['attempts'] == 0
          PY

  terminal-session:
    name: Terminal session (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-intel
          - os: windows-2025
            target: windows-x64
    defaults:
      run:
        shell: bash
    env:
      IELTS_DISABLE_UPDATE_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install isolated terminal-test dependencies
        run: python -m pip install -r requirements-terminal-test.txt
      - name: Check offline report rendering
        run: python -X utf8 -B -m unittest discover -s tools -p 'test_terminal_*.py' -q
      - name: Measure native Windows Unicode cell positions
        if: matrix.target == 'windows-x64'
        continue-on-error: true
        run: python -X utf8 -B tools/terminal_width_probe.py --output artifacts/terminal-width-windows-x64
      - name: Exercise actual terminal input, screen output, resize and resume
        run: python -X utf8 -B tools/terminal_smoke.py --output artifacts/terminal-${{ matrix.target }}
      - name: Preserve replay and failure evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: terminal-${{ matrix.target }}
          path: artifacts/terminal-${{ matrix.target }}/
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 90
      - name: Preserve native Windows width measurements
        if: always() && matrix.target == 'windows-x64'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: terminal-width-windows-x64
          path: artifacts/terminal-width-windows-x64/
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 90
